# Auto-deploy to the Hostinger VPS on every push to main.
# Needs repo secrets: VPS_HOST (server IP) and VPS_SSH_KEY (private key whose .pub is in the server's authorized_keys).
name: Deploy to VPS

on:
  push:
    branches: [main]
    # Mobile apps ship through EAS, and the frozen web desks aren't deployed; skip those changes.
    paths-ignore:
      - "traveler-mob/**"
      - "captain-mob/**"
      - "mobile-core/**"
      - "traveler-desk/**"
      - "captain-desk/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh root@"$VPS_HOST" 'set -e
            cd /opt/goloc
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env.production up -d --build --remove-orphans
            docker image prune -f
            sleep 20
            docker compose --env-file .env.production ps
            curl -fsS --retry 5 --retry-delay 5 --resolve api.goloc.in:443:127.0.0.1 https://api.goloc.in/api/v1/health/'
