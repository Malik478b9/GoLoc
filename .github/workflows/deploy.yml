# Auto-deploy to the Hostinger VPS on every push to main.
# Needs repo secrets: VPS_HOST (server IP) and VPS_SSH_KEY (private key whose .pub is in the server's authorized_keys).
name: Deploy to VPS

on:
  push:
    branches: [main]
    # The frozen web desks aren't deployed; skip changes that only touch them.
    # (traveler-mob / captain-mob / mobile-core DO deploy: their web versions run on app./captain.goloc.in.)
    paths-ignore:
      - "traveler-desk/**"
      - "captain-desk/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          mkdir -p ~/.ssh
          # VPS_SSH_KEY may be the raw key or a one-line base64 of it (base64 -w0 ~/.ssh/actions)
          if printf '%s' "$VPS_SSH_KEY" | grep -q "BEGIN OPENSSH"; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "VPS_SSH_KEY is not a valid private key"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes root@"$VPS_HOST" 'set -e
            cd /opt/goloc
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env.production up -d --build --remove-orphans
            docker image prune -f
            sleep 20
            docker compose --env-file .env.production ps
            curl -fsS --retry 5 --retry-delay 5 --resolve api.goloc.in:443:127.0.0.1 https://api.goloc.in/api/v1/health/'
