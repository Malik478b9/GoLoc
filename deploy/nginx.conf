upstream goloc_api {
    server api:8000;
    keepalive 32;
}

# Put TLS in front of this (a cloud load balancer, Caddy, or certbot on this nginx)
# and make sure it sends X-Forwarded-Proto: https.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 110m;          # reels up to 100 MB
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API, payment pages, shared-trip pages, Django admin and static files
    location ~ ^/(api|pay|t|django-admin|static)/ {
        proxy_pass http://goloc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering off;    # stream large uploads straight to gunicorn
    }

    # Public uploads (avatars, reels, covers). KYC files live elsewhere and are never served here.
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Agency console (single-page app)
    location /agency/ {
        alias /usr/share/nginx/agency/;
        try_files $uri $uri/ /agency/index.html;
    }

    # Admin console (single-page app)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        location ~* \.(js|css|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
