upstream goloc_api {
    server api:8000;
    keepalive 32;
}

# TLS is terminated here with a Let's Encrypt certificate (goloc.in, www.goloc.in, api.goloc.in)
# issued on the host by certbot and mounted read-only at /etc/letsencrypt. See deploy/README.md.

# Plain HTTP: everything moves to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Shared TLS settings
ssl_certificate     /etc/letsencrypt/live/goloc.in/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/goloc.in/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Landing site: goloc.in and www.goloc.in
server {
    listen 443 ssl default_server;
    http2 on;
    server_name goloc.in www.goloc.in;

    if ($host = www.goloc.in) {
        return 301 https://goloc.in$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    root /usr/share/nginx/landing;

    # Pages are linked without ".html" (/privacy, /terms, ...)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# API, admin console and agency console: api.goloc.in
server {
    listen 443 ssl;
    http2 on;
    server_name api.goloc.in;

    client_max_body_size 110m;          # reels up to 100 MB

    # API, payment pages, shared-trip pages, Django admin and static files
    location ~ ^/(api|pay|t|django-admin|static)/ {
        proxy_pass http://goloc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;    # stream large uploads straight to gunicorn
    }

    # Public uploads (avatars, reels, covers). KYC files live elsewhere and are never served here.
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Agency console (single-page app)
    location /agency/ {
        alias /usr/share/nginx/agency/;
        try_files $uri $uri/ /agency/index.html;
    }

    # Admin console (single-page app)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        location ~* \.(js|css|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
